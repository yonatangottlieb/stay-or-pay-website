name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-v2"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='tests' \
            --exclude='package.json' \
            --exclude='scripts' \
            --exclude='.lighthouse' \
            ./ _site/
          touch _site/.nojekyll
          test -f _site/data-deletion/index.html
          test -f _site/oauth/callback/index.html
          test -f _site/assets/config/supabase.public.js
          # Ensure public config is not a placeholder in production builds.
          ! grep -q 'YOUR_PROJECT' _site/assets/config/supabase.public.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
